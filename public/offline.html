<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline · RallyHub</title>
    <!--
      Shown by the service worker when a page load fails with no connection.
      Everything is inline and no asset is referenced, because nothing else is
      cached: a logo or a webfont here would be a broken image offline.
    -->
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        padding: 2rem 1.5rem;
        text-align: center;
        background: #1a1a1a;
        color: #ffffff;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      h1 {
        margin: 0;
        font-size: clamp(1.75rem, 7vw, 3rem);
        font-weight: 900;
        line-height: 1.1;
        text-wrap: balance;
      }
      p {
        margin: 0;
        max-width: 26rem;
        font-size: 1rem;
        font-weight: 600;
        opacity: 0.65;
      }
      button {
        margin-top: 0.5rem;
        padding: 0.75rem 1.75rem;
        border: none;
        border-radius: 9999px;
        background: #ffc107;
        color: #1a1a1a;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      button:hover {
        filter: brightness(1.08);
      }
      button:focus-visible {
        outline: 2px solid #ffffff;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <h1>You are offline</h1>
    <p>
      RallyHub needs a connection to load. Check your wifi or mobile data, then
      try again.
    </p>
    <button type="button" onclick="location.reload()">Try again</button>
  </body>
</html>
